[coop]
; off / host / join  (start_host.ps1 and start_client.ps1 set this for you)
mode=host
; address of the host PC for mode=join (127.0.0.1 = same PC)
host_ip=127.0.0.1
name=HOST
max_players=4
; 1 = allow two copies on one PC (separate client port, shared file access)
allow_two_instances=1
; UDP port the client uses when both copies run on one PC
client_port=15012
; client game mode byte: 0 = same as host (default), 2 = old behaviour
client_mode_byte=0
; 1 = let the client run its own story/missions/AI (normally the host does it)
client_campaign=0
; 1 = skip broken network packets instead of crashing (and log them)
net_guard=1
; 0 = a joining guest appears at the New Game start point (safe). 1 = next to the host (crashed the host before)
spawn_near_host=0
; 1 = the client does not create NPCs/bodies/objects at all (broke loading: sun etc. missing). Keep 0
client_block_creates=0
; 1 = the client sends only its own player/vehicle to the host, not the NPCs/objects it loaded itself
client_send_filter=1
; debug
probe=0
log_console=1
; 1 = on the client, Load Game runs New Game (Load Game got stuck on LOADING)
client_load_as_new=1
; 1 = the client tells its game the world is ready once its player exists (fixes endless LOADING)
client_world_ready=1
; 1 = the host ignores entities a guest tries to create (stops ghost objects and the crash they cause)
host_reject_guest_creates=1
; 1 = the client gives its own objects local numbers so the host's player/NPCs can appear on the client
client_local_pids=1
; bytes/s the host may send to each guest (the default was so low that the host's world never reached the guest). 0 = engine default
host_send_rate=400000
; 1 = each game also loads the map around the other players (without it, players far apart crash/stall)
stream_all_players=1
; 1 = the guest uses the host's time of day (and so the same sky/rain). Side channel on UDP sync_port
sync_clock=1
sync_port=15013
; 1 = the guest removes its own copies of NPCs/animals/bodies that the host also sends (no more doubles; doors are kept)
client_remove_duplicates=1
; 1 = the same for cars/boats/helicopters/planes/tanks (the guest then uses the host's vehicles)
client_remove_duplicate_vehicles=0
; 1 = the host gives a guest's character a weapon model so the gun shows in its hands
host_guest_weapon=1
; 1 = the guest also takes the host's weather (it is random per game hour, not from the clock)
sync_weather=1
; 1 = doors/buttons the guest uses open for the guest AND on the host
client_use_doors=1
; 1 = a dead player (host or guest) comes back after 8 s next to another player (fresh inventory)
respawn=1
; 1 = the guest's bullets hurt the host's NPCs (hits are reported to the host)
client_shoot_host_npcs=1
; 1 = the guest can get into its own cars/boats (the host does not see that car yet)
client_use_vehicles=1
; 1 = the guest's bullets can also hurt the host player (and the host's)
friendly_fire=0
; 0.14.5 host: put guest players on the host player's side so enemy NPCs target them too
npcs_target_guest=1

; ---- 0.15 ----
; host: saving works in co-op (normal save menu / quicksave); the guests' characters are left out of the file
host_coop_save=1
; guest: the host's quest/mission state (PDA, target marker) is copied to the guest
sync_quests=1
; guest: the host's faction reputation (16 sides) is copied to the guest
sync_reputation=1
; guest: its character (money, experience, inventory) is saved to coop_profile.ini when the guest presses save,
; when the host saves, and every 2 minutes; it is restored 8 s after joining
guest_profile=1
; a console window for admin commands (type help). F8 on the host = "bring all"
admin_console=1
; 0.15.1 guest: taxi stands of the host work for the guest (the trip runs on the guest)
client_use_taxi=1
